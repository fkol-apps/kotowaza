<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>世界のことわざ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    background: #0d0e1a;
    color: #e8eaf6;
    font-family: "Yu Gothic UI", "Meiryo UI", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    justify-content: center;
    padding: 14px 14px 18px;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  /* 背景グラデーション */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(80,40,160,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(20,80,160,0.20) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    min-height: calc(100dvh - 32px);
  }

  /* ─── ヘッダー ─── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: background 0.4s, color 0.4s;
  }
  .badge.daily  { background: #ffd166; color: #1a1030; }
  .badge.random { background: #06d6a0; color: #0a2018; }
  .badge.browse { background: #3d4680; color: #e8eaf6; }

  .date-label {
    font-size: 12px;
    color: #7075a0;
  }

  /* ─── フィルターチップ ─── */
  .chips {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #9090bb;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
  }
  .chip.active {
    background: #ffd166;
    border-color: #ffd166;
    color: #1a1030;
  }

  .counter {
    margin-left: auto;
    font-size: 11px;
    color: #505080;
    white-space: nowrap;
  }

  /* ─── フリップカード ─── */
  .card-stage {
    flex: 1;
    display: flex;
    perspective: 1400px;
    margin: 14px 0 6px;
    min-height: 340px;
    touch-action: pan-y;
  }

  .card {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.3, 1), opacity 0.2s ease;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .card.flipped  { transform: rotateY(180deg); }
  .card.dragging { transition: opacity 0.2s ease; }
  .card.fade     { opacity: 0; }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 22px;
    background: rgba(30, 32, 56, 0.9);
    border: 1px solid rgba(80,85,140,0.45);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 36px 26px;
    overflow: hidden;
  }

  /* カードの光沢ライン */
  .face::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  }

  .face.back {
    transform: rotateY(180deg);
    background: rgba(24, 32, 54, 0.92);
  }

  .fav-btn {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none !important;
    border: none;
    font-size: 24px;
    color: #505080;
    padding: 8px;
    line-height: 1;
    z-index: 2;
  }
  .fav-btn.on { color: #ffd166; }

  .country {
    font-size: 12px;
    color: #7075a0;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
  }
  .face.back .country { margin: 18px 0 0; }

  .proverb-text {
    font-size: clamp(18px, 5.4vw, 26px);
    font-weight: 700;
    color: #ffd166;
    line-height: 1.6;
    letter-spacing: 0.02em;
    white-space: pre-line;
  }

  .hint {
    font-size: 10px;
    color: #505080;
    margin-top: 26px;
    letter-spacing: 0.06em;
  }

  .meaning-label {
    font-size: 11px;
    color: #ffd166;
    letter-spacing: 0.3em;
    margin-bottom: 16px;
  }

  .meaning {
    font-size: 15px;
    color: #d6d9f2;
    line-height: 1.9;
    max-width: 460px;
  }

  /* ─── ナビゲーション ─── */
  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }

  .btn-group {
    display: flex;
    gap: 8px;
    flex: 1;
    justify-content: center;
  }

  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 12px;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    letter-spacing: 0.02em;
  }
  button:active { transform: scale(0.96); }

  .btn-arrow {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #9090bb;
    font-size: 22px;
    flex: none;
    padding-bottom: 3px;
  }

  .btn-daily {
    background: #2e3562;
    color: #e8eaf6;
    padding: 11px 18px;
  }

  .btn-random {
    background: #1a3d30;
    color: #06d6a0;
    border: 1px solid #06d6a0;
    padding: 11px 18px;
  }

  .btn-copy {
    background: rgba(255,255,255,0.06);
    color: #9090bb;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 11px 14px;
  }
  .btn-copy.copied { color: #ffd166; border-color: #ffd166; }

  @media (hover: hover) {
    .btn-daily:hover  { background: #3d4680; box-shadow: 0 4px 16px rgba(80,100,200,0.3); }
    .btn-random:hover { background: #06d6a0; color: #0a2018; box-shadow: 0 4px 16px rgba(6,214,160,0.3); }
    .btn-copy:hover   { background: rgba(255,255,255,0.12); color: #e8eaf6; }
    .btn-arrow:hover  { background: rgba(255,255,255,0.12); color: #e8eaf6; }
    .chip:hover:not(.active) { background: rgba(255,255,255,0.12); color: #e8eaf6; }
  }

  /* ─── 検索 ─── */
  .search-bar {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-input {
    flex: 1;
    background: rgba(30,32,56,0.7);
    border: 1px solid rgba(80,85,140,0.4);
    border-radius: 12px;
    color: #e8eaf6;
    font-family: inherit;
    font-size: 16px;
    padding: 10px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input::placeholder { color: #505080; font-size: 13px; }
  .search-input:focus { border-color: #6066a0; }

  .search-count {
    font-size: 11px;
    color: #505080;
    white-space: nowrap;
  }

  /* ─── フッター ─── */
  .footer {
    margin-top: 14px;
    text-align: center;
    font-size: 11px;
    color: #404060;
  }

  @media (max-width: 380px) {
    .btn-daily, .btn-random { padding: 11px 12px; font-size: 12px; }
    .face { padding: 30px 20px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <span class="badge daily" id="badge">📅 今日のことわざ</span>
    <span class="date-label" id="dateLabel"></span>
  </div>

  <div class="chips">
    <button class="chip active" id="chipAll" onclick="setMode('all')">🌏 すべて</button>
    <button class="chip" id="chipFav" onclick="setMode('fav')">⭐ お気に入り</button>
    <span class="counter" id="counter"></span>
  </div>

  <div class="card-stage" id="stage">
    <div class="card" id="card">
      <div class="face front">
        <button class="fav-btn" id="favBtn" onclick="toggleFav(event)">☆</button>
        <div class="country" id="country"></div>
        <div class="proverb-text" id="proverbText"></div>
        <div class="hint">タップで意味を表示 ／ スワイプで次のカードへ</div>
      </div>
      <div class="face back">
        <button class="fav-btn" id="favBtnBack" onclick="toggleFav(event)">☆</button>
        <div class="meaning-label">— 意味 —</div>
        <div class="meaning" id="meaning"></div>
        <div class="country" id="backCountry"></div>
        <div class="hint">タップで表に戻る</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="btn-arrow" onclick="prevCard()" aria-label="前へ">‹</button>
    <div class="btn-group">
      <button class="btn-daily"  onclick="showDaily()">📅 今日</button>
      <button class="btn-random" onclick="showRandom()">🎲 ランダム</button>
      <button class="btn-copy" id="copyBtn" onclick="copyProverb()" title="コピー">📋</button>
    </div>
    <button class="btn-arrow" onclick="nextCard()" aria-label="次へ">›</button>
  </div>

  <div class="search-bar">
    <input class="search-input" type="text" id="searchInput"
           placeholder="ことわざ・国名・意味で検索…" oninput="onSearch(this.value)">
    <span class="search-count" id="searchCount"></span>
  </div>

  <div class="footer">世界のことわざ集 — <span id="totalCount"></span>件 収録</div>

</div>

  {text:"אם אין אני לי, מי לי", meaning:"もし私が自分のためにならないなら、誰がなるというのか（自助の精神）", country:"イスラエル（ヘブライ語）"},
  // トルコ
  {text:"Damlaya damlaya göl olur", meaning:"一滴一滴が湖になる。小さな積み重ねが大きな成果を生む", country:"トルコ"},
  {text:"Bugünün işini yarına bırakma", meaning:"今日の仕事を明日に残すな。先延ばしにするな", country:"トルコ"},
  {text:"İşleyen demir pas tutmaz", meaning:"動く鉄は錆びない。活動し続ける者は衰えない", country:"トルコ"},
  // ペルシャ
  {text:"صبر تلخ است ولی میوه شیرین دارد", meaning:"忍耐は苦いが、その果実は甘い", country:"ペルシャ（イラン）"},
  {text:"هر که بامش بیش، برفش بیشتر", meaning:"屋根が大きいほど、雪も多く積もる。地位が高いほど責任も重い", country:"ペルシャ（イラン）"},
  {text:"کار نیک را کن و در آب انداز", meaning:"良いことをして、川に流せ。見返りを求めずに善行をせよ", country:"アフガニスタン"},
  {text:"صبر کا پھل میٹھا ہوتا ہے", meaning:"忍耐の果実は甘い。辛抱すれば良いことがある", country:"パキスタン（ウルドゥー語）"},
  // アフリカ
  {text:"Ukweli ni mwanga", meaning:"真実は光。真実を語ることが道を照らす", country:"東アフリカ（スワヒリ語）"},
  {text:"Haraka haraka haina baraka", meaning:"急いでも幸運は来ない。焦っても良い結果は生まれない", country:"東アフリカ（スワヒリ語）"},
  {text:"Damu nzito kuliko maji", meaning:"血は水より濃い。家族の絆は他の何よりも強い", country:"東アフリカ（スワヒリ語）"},
  {text:"Umuntu ngumuntu ngabantu", meaning:"人は他の人々によって人になる。人は互いのつながりで生きている", country:"南アフリカ（ズールー語）"},
  {text:"If you want to go fast, go alone. If you want to go far, go together.", meaning:"速く行きたければ一人で行け、遠くへ行きたければ皆で行け", country:"アフリカ"},
  {text:"It takes a village to raise a child", meaning:"子供一人を育てるには村全体が必要。育ちは社会全体の責任", country:"アフリカ（ナイジェリア）"},
  {text:"እሳት ሲጠጉ ያሞቃል ሲርቁ ያቀዘቅዛል", meaning:"火は近くにいれば温め、離れれば冷たくなる。関係は距離で変わる", country:"エチオピア"},
  {text:"Yetebaberut lijoch ahiya ayidarum", meaning:"一緒に育った子供たちは、ロバでも引き倒せない。仲間の絆は強い", country:"エチオピア"},
  {text:"Obra ye Obi Ntoma", meaning:"人生は他人の服。誰も他人の人生を完全に理解はできない", country:"ガーナ（アカン語）"},
  {text:"Onipa na ohia onipa", meaning:"人は人を必要とする。誰もが誰かを必要としている", country:"ガーナ"},
  {text:"Jëf ak xam-xam dafa am solo", meaning:"行動と知識の両方が価値を持つ", country:"セネガル（ウォロフ語）"},
  {text:"Ny fiainana toy ny ala: aleo aloha ny hatsaram-panahy", meaning:"人生は森のよう。まず親切心を前に出せ", country:"マダガスカル"},
  {text:"Bi omi ba pọ, eja a pọ", meaning:"水が多いところに魚が集まる。豊かなところに人が集まる", country:"ナイジェリア（ヨルバ語）"},
  // 北欧 / 西欧
  {text:"Det finnes ikke dårlig vær, bare dårlige klær", meaning:"悪い天気はない、あるのは悪い服装だけ。準備次第で何でも乗り越えられる", country:"ノルウェー"},
  {text:"Lagom är bäst", meaning:"ほどほどが一番。何事も適度が最善", country:"スウェーデン"},
  {text:"Työ tekijäänsä kiittää", meaning:"仕事は作者を褒める。誠実に仕事をすれば、それが自分を証明する", country:"フィンランド"},
  {text:"Þetta reddast", meaning:"なんとかなる。どうにかなるさというアイスランド人の楽観的精神", country:"アイスランド"},
  {text:"Den der tier, samtykker", meaning:"黙っている者は同意している。沈黙は肯定のしるし", country:"デンマーク"},
  {text:"Øvelse gør mester", meaning:"練習が名人を作る。継続的な努力が技術を磨く", country:"デンマーク"},
  {text:"Spare in der Zeit, so hast du in der Not", meaning:"豊かなときに節約せよ、そうすれば困ったときにも持つ", country:"スイス（ドイツ語圏）"},
  {text:"Reden ist Silber, Schweigen ist Gold", meaning:"言葉は銀、沈黙は金。語るよりも黙ることが時に価値がある", country:"オーストリア"},
  {text:"Wie niet werkt, zal niet eten", meaning:"働かない者は食べてはならない。働いてこそ報われる", country:"ベルギー"},
  {text:"Wie niet waagt, die niet wint", meaning:"挑戦しない者は勝てない", country:"オランダ"},
  {text:"Is fearr Gaeilge briste ná Béarla cliste", meaning:"下手なアイルランド語は巧みな英語より良い。母語への誇りを忘れるな", country:"アイルランド"},
  {text:"Ní neart go cur le chéile", meaning:"協力なくして力なし。団結してこそ強くなれる", country:"アイルランド"},
  {text:"Dinnae teach your grandmother to suck eggs", meaning:"祖母に卵の吸い方を教えるな。経験者に基本を教えようとするな", country:"スコットランド"},
  {text:"Mony a mickle maks a muckle", meaning:"小銭が積もれば大金になる。小さな積み重ねを侮るな", country:"スコットランド"},
  {text:"Heb ei fai, heb ei eni", meaning:"欠点のない者は生まれていない。完璧な人間はいない", country:"ウェールズ"},
  // 東欧・南欧
  {text:"Lassan járj, tovább érsz", meaning:"ゆっくり行けば、もっと遠くへ行ける", country:"ハンガリー"},
  {text:"Bez práce nejsou koláče", meaning:"働かなければケーキは食べられない。働かざる者食うべからず", country:"チェコ"},
  {text:"Nie chwal dnia przed zachodem słońca", meaning:"夕日が沈む前に一日を褒めるな。結果が出るまで喜ぶな", country:"ポーランド"},
  {text:"Σιγά σιγά πάει μακριά", meaning:"ゆっくりゆっくり遠くへ行く。焦らずじっくりが遠道の近道", country:"ギリシャ"},
  {text:"Graba strică treaba", meaning:"急ぎは仕事を台無しにする。焦ると失敗する", country:"ルーマニア"},
  {text:"Omul sfințește locul", meaning:"人が場所を聖なるものにする。人によって場所の価値が決まる", country:"ルーマニア"},
  {text:"Без труда нема плода", meaning:"苦労なくして果実なし。努力なしに成果は得られない", country:"ウクライナ"},
  {text:"Де згода, там і перемога", meaning:"一致団結するところに勝利がある", country:"ウクライナ"},
  {text:"Не оставяй за утре това, което можеш да направиш днес", meaning:"今日できることを明日に残すな", country:"ブルガリア"},
  {text:"Слога кућу гради", meaning:"調和が家を建てる。団結が何かを生み出す", country:"セルビア"},
  {text:"Bolje spriječiti nego liječiti", meaning:"治療より予防の方が良い。後悔する前に備えよ", country:"クロアチア"},
  {text:"Bez práce nie sú koláče", meaning:"働かなければケーキは食べられない。努力なくして成果なし", country:"スロバキア"},
  // コーカサス・中央アジア
  {text:"სტუმარი ღვთის მოვლინებაა", meaning:"客は神の遣い。訪ねてくる人は大切にしなければならない", country:"ジョージア"},
  {text:"Ծառը, որ ծաղիկ չի տալիս, ստվեր չի տալիս", meaning:"花を咲かせない木は陰を作れない。与えない者は守れない", country:"アルメニア"},
  {text:"Ağac meyvəsindən tanınar", meaning:"木はその実でわかる。人はその行いで知られる", country:"アゼルバイジャン"},
  {text:"Жеті рет өлшеп, бір рет кес", meaning:"七回測って一回切れ。慎重に考えてから行動せよ", country:"カザフスタン"},
  {text:"Bilim — nur, bilmaslik — qorong'ulik", meaning:"知識は光、無知は闇", country:"ウズベキスタン"},
  {text:"Sabyr düybünde altyn bar", meaning:"忍耐の底には金がある。辛抱の先に宝がある", country:"中央アジア"},
  // バルト三国
  {text:"Kiek žmonių, tiek nuomonių", meaning:"人の数だけ意見がある。十人十色", country:"リトアニア"},
  {text:"Kā sauc, tā atbild", meaning:"呼ぶように、応じる。自分の言葉は返ってくる", country:"ラトビア"},
  {text:"Töö kiidab tegijat", meaning:"仕事が作者を褒める。仕事の質が人を語る", country:"エストニア"},
  // 東南アジア
  {text:"ไม้อ่อนดัดง่าย ไม้แก่ดัดยาก", meaning:"若い木は曲げやすい、老いた木は曲げにくい。子供のうちに教育せよ", country:"タイ"},
  {text:"น้ำขึ้นให้รีบตัก", meaning:"水が上がったときにすくえ。チャンスが来たら逃すな", country:"タイ"},
  {text:"Học ăn, học nói, học gói, học mở", meaning:"食べ方・話し方・包み方・開け方を学べ。礼儀作法すべてが学びの対象", country:"ベトナム"},
  {text:"Có công mài sắt, có ngày nên kim", meaning:"鉄を磨き続ければ、いつか針になる。継続は力なり", country:"ベトナム"},
  {text:"Bersatu kita teguh, bercerai kita runtuh", meaning:"団結すれば強く、分裂すれば倒れる", country:"インドネシア"},
  {text:"Seperti menatang minyak yang penuh", meaning:"満杯の油を運ぶように大切に扱え。慎重さと敬意を忘れるな", country:"マレーシア"},
  {text:"Tak kenal maka tak cinta", meaning:"知らなければ愛せない。理解することが愛の始まり", country:"マレーシア"},
  {text:"ដំបូងគិត ក្រោយនិយាយ", meaning:"まず考えて、それから話せ。口より先に頭を使え", country:"カンボジア（クメール語）"},
  {text:"ကြိုးစားမှ ကြိုးပမ်းနိုင်", meaning:"努力してこそ達成できる", country:"ミャンマー"},
  {text:"Ang hindi marunong lumingon sa pinanggalingan ay hindi makakarating sa paroroonan", meaning:"来た道を振り返れない者は、目的地に着けない。自分の過去を大切に", country:"フィリピン"},
  // 南アジア
  {text:"ඉවසීම ජය ගනී", meaning:"忍耐は勝利する。辛抱強さが最終的に勝つ", country:"スリランカ（シンハラ語）"},
  {text:"जहाँ जाउ त्यहाँको बन", meaning:"郷に入っては郷に従え。その土地のルールを尊重せよ", country:"ネパール"},
  // 中央アジア・チベット
  {text:"མི་ལ་གཅིག་གིས་ཕན་ཐོགས་བྱེད་ན་སྐྱེ་བ་ཡིག་པར་འགྱུར", meaning:"一人が他の人を助けることができれば、その生は意味を持つ", country:"チベット"},
  {text:"རྒྱལ་ཁམས་ཀྱི་དགའ་སྐྱིད་ནི་མི་མང་གི་དགའ་སྐྱིད་ཡིན།", meaning:"国の幸福は国民の幸福にある。GNH（国民総幸福量）の精神", country:"ブータン"},
  // モンゴル
  {text:"Нэг үгийн буруу мянган үгийн тайлбараар засдаггүй", meaning:"一言の誤りは千言の説明で直せない。言葉は慎重に選べ", country:"モンゴル"},
  // オセアニア
  {text:"No worries, mate", meaning:"心配するな、大丈夫。楽観的に物事を捉えよ", country:"オーストラリア"},
  {text:"He aha te mea nui o te ao? He tangata, he tangata, he tangata", meaning:"世界で最も大切なものは何か？人、人、人だ", country:"マオリ（ニュージーランド）"},
  {text:"Whāia te iti kahurangi ki te tūohu koe me he maunga teitei", meaning:"高い目標を持て。もし頭を垂れるなら、それは高い山のように", country:"マオリ（ニュージーランド）"},
  // 北米
  {text:"We do not inherit the earth from our ancestors; we borrow it from our children", meaning:"私たちは大地を祖先から受け継いだのではない。子供たちから借りているのだ", country:"ネイティブ・アメリカン"},
  {text:"Don't judge a man until you have walked two moons in his moccasins", meaning:"その人の靴で二か月歩くまで、人を裁くな。相手の立場を理解せよ", country:"ネイティブ・アメリカン（チェロキー族）"},
  {text:"Vouloir, c'est pouvoir, mais pouvoir n'est pas toujours vouloir", meaning:"意志は力になる。しかし力があっても意志がなければ動けない", country:"カナダ（ケベック）"},
  // カリブ
  {text:"Every mickle mek a muckle", meaning:"一つ一つが積み重なって大きくなる。小さなことを大切に", country:"ジャマイカ"},
  {text:"Deye mòn gen mòn", meaning:"山の向こうにまた山がある。一つの困難を乗り越えても次がある", country:"ハイチ"},
  // ブラジル / ポルトガル
  {text:"Quem não arrisca, não petisca", meaning:"リスクを冒さない者は何も得られない。挑戦なくして成果なし", country:"ブラジル"},
  {text:"Devagar e sempre", meaning:"ゆっくりと、しかし着実に。焦らずコツコツ続けることが大切", country:"ポルトガル"},
  // 日本（追加）
  {text:"虎穴に入らずんば虎子を得ず", meaning:"危険を冒さなければ、大きな成果は得られない", country:"日本"},
  {text:"猿も木から落ちる", meaning:"どんな名人でも失敗することがある。驕らず謙虚でいよ", country:"日本"},
  {text:"花より団子", meaning:"風情よりも実利を好む。見た目より中身が大切", country:"日本"},
  {text:"知らぬが仏", meaning:"知らないでいる方が、かえって穏やかでいられることがある", country:"日本"},
  {text:"門前の小僧習わぬ経を読む", meaning:"日常的に触れていれば、自然と身につくことがある", country:"日本"},
  {text:"一石二鳥", meaning:"一つの行動で二つの利益を得る", country:"日本"},
  {text:"棚からぼた餅", meaning:"思いがけない幸運が突然やってくること", country:"日本"},
  {text:"目は口ほどにものを言う", meaning:"目は言葉と同じくらい多くのことを伝える", country:"日本"},
  {text:"七難八苦を越えて", meaning:"多くの苦難を乗り越えてこそ、本当の強さが生まれる", country:"日本"},
  {text:"身から出た錆", meaning:"自分の行いが招いた悪い結果は、自分で引き受けるしかない", country:"日本"},
  // 中国（追加）
  {text:"一分耕耘，一分收获", meaning:"耕した分だけ収穫できる。努力した分だけ結果が出る", country:"中国"},
  {text:"三人行，必有我师焉", meaning:"三人旅をすれば、必ず自分の師となる人がいる", country:"中国（孔子）"},
  {text:"欲速则不达", meaning:"急ぎすぎると目標に達しない。焦りは禁物", country:"中国"},
  {text:"工欲善其事，必先利其器", meaning:"仕事をうまくやろうとすれば、まず道具を整えよ。準備が大切", country:"中国"},
  {text:"吃一堑，长一智", meaning:"一度失敗すれば、一つ賢くなる。失敗から学べ", country:"中国"},
  // 韓国（追加）
  {text:"하늘이 무너져도 솟아날 구멍이 있다", meaning:"天が崩れても逃げ穴がある。どんな絶望的な状況にも必ず活路がある", country:"韓国"},
  {text:"공든 탑이 무너지랴", meaning:"努力して築いた塔は崩れない。誠実な努力は必ず報われる", country:"韓国"},
  {text:"백지장도 맞들면 낫다", meaning:"一枚の紙も二人で持てば楽になる。協力の大切さ", country:"韓国"},
  {text:"말이 씨가 된다", meaning:"言葉は種になる。口に出したことは実現することがある", country:"韓国"},
  // ラテンアメリカ（追加）
  {text:"A pressa é inimiga da perfeição", meaning:"急ぎは完璧の敵。焦ると仕事が雑になる", country:"ブラジル"},
  {text:"Quem tem boca vai a Roma", meaning:"口のある者はローマへも行ける。聞くことを恐れるな", country:"ポルトガル"},
  {text:"Água mole em pedra dura tanto bate até que fura", meaning:"柔らかい水でも硬い岩に打ち続ければ穴が開く。継続の力", country:"ブラジル"},
  {text:"No se ganó Zamora en una hora", meaning:"サモラは一時間で征服されなかった。大きなことは時間がかかる", country:"スペイン"},
  {text:"A caballo regalado no le mires el diente", meaning:"もらった馬の歯を見るな。贈り物に文句を言うな", country:"スペイン"},
  {text:"Dime con quién andas y te diré quién eres", meaning:"誰と歩くかを言えば、あなたが誰かわかる。付き合う人で人柄がわかる", country:"スペイン"},
  {text:"Del dicho al hecho hay un gran trecho", meaning:"言うことと行うことの間には大きな隔たりがある", country:"メキシコ"},
  {text:"Pueblo unido jamás será vencido", meaning:"団結した民は決して征服されない", country:"チリ"},
  // アフリカ（追加）
  {text:"Asante sana, utashinda kila wakati", meaning:"感謝する者は常に勝つ。感謝の心が成功を呼ぶ", country:"東アフリカ（スワヒリ語）"},
  {text:"Sticks in a bundle are unbreakable", meaning:"束になった枝は折れない。団結の力は偉大だ", country:"ケニア"},
  {text:"A child who is not embraced by the village will burn it down to feel its warmth", meaning:"村に受け入れられない子供は温もりを求めて村を燃やす。社会の包容力の大切さ", country:"アフリカ"},
  {text:"Until the lion learns to write, every story will glorify the hunter", meaning:"ライオンが書くことを学ぶまで、すべての物語はハンターを称える。語る者が歴史を作る", country:"アフリカ"},
  {text:"Do not look where you fell, but where you slipped", meaning:"倒れた場所ではなく、滑った場所を見よ。失敗の原因を探れ", country:"ガーナ"},
  {text:"Rain does not fall on one roof alone", meaning:"雨は一つの屋根だけに降るのではない。喜びも苦しみも分かち合うもの", country:"カメルーン"},
  {text:"However long the night, the dawn will break", meaning:"夜がどれほど長くても、夜明けは来る", country:"マリ"},
  {text:"Speak softly and carry a big stick", meaning:"穏やかに語り、大きな棍棒を持て。準備と謙虚さが大切", country:"西アフリカ"},
  // 中東・南アジア（追加）
  {text:"يد واحدة لا تصفق", meaning:"片手では拍手できない。何事も協力が必要", country:"アラビア"},
  {text:"إذا أردت أن تعرف رجلا فانظر إلى صديقه", meaning:"人を知りたければ、その友人を見よ。友人は人格を映す鏡", country:"アラビア"},
  {text:"من عاشر القوم أربعين يوما صار منهم", meaning:"四十日間人々と共にいれば、その一員になる。環境が人を形成する", country:"モロッコ"},
  {text:"آینه عیب رو نشان می‌دهد", meaning:"鏡は欠点を映す。真実は時に耳の痛いことを告げる", country:"ペルシャ（イラン）"},
  {text:"جو بوئی، همان دروی", meaning:"蒔いた種を刈り取る。自分の行いは自分に返ってくる", country:"ペルシャ（イラン）"},
  {text:"जल्दी का काम शैतान का", meaning:"急いでする仕事は悪魔のもの。焦りは失敗を招く", country:"インド（ヒンディー語）"},
  {text:"अकेला चना भाड़ नहीं फोड़ सकता", meaning:"一粒のひよこ豆では鍋は割れない。一人の力には限界がある", country:"インド（ヒンディー語）"},

// ==========================================
// ロジック
// ==========================================
let favs = new Set(JSON.parse(localStorage.getItem("kotowazaFavs") || "[]"));
let mode = "all";        // all | fav
let query = "";
let pool = [];           // 表示対象の PROVERBS インデックス配列
let pos = 0;             // pool 内の現在位置
let badgeType = "daily"; // daily | random | browse

const card  = document.getElementById("card");
const stage = document.getElementById("stage");

function getDailyIndex() {
  const d = new Date();
  const s = d.getFullYear() + "-" +
            String(d.getMonth()+1).padStart(2,"0") + "-" +
            String(d.getDate()).padStart(2,"0");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
  return h % PROVERBS.length;
}

function formatDate(d) {
  return `${d.getFullYear()}年 ${d.getMonth()+1}月 ${d.getDate()}日（` +
         ["日","月","火","水","木","金","土"][d.getDay()] + "）";
}

function rebuildPool() {
  let base = PROVERBS.map((_, i) => i);
  if (mode === "fav") base = base.filter(i => favs.has(PROVERBS[i].text));
  if (query) {
    const lower = query.toLowerCase();
    base = base.filter(i => {
      const p = PROVERBS[i];
      return p.text.toLowerCase().includes(lower) ||
             p.meaning.includes(query) ||
             p.country.includes(query);
    });
  }
  pool = base;
  if (pos >= pool.length) pos = 0;
}

function render() {
  const p = pool.length ? PROVERBS[pool[pos]] : null;
  document.getElementById("country").textContent     = p ? `[ ${p.country} ]` : "";
  document.getElementById("backCountry").textContent = p ? `[ ${p.country} ]` : "";
  document.getElementById("proverbText").textContent = p ? p.text : "該当するカードがありません";
  document.getElementById("meaning").textContent     = p ? p.meaning : "";
  document.getElementById("counter").textContent     = pool.length ? `${pos + 1} / ${pool.length}` : "0 / 0";
  const on = p && favs.has(p.text);
  for (const id of ["favBtn", "favBtnBack"]) {
    const b = document.getElementById(id);
    b.textContent = on ? "★" : "☆";
    b.classList.toggle("on", !!on);
  }
  const badge = document.getElementById("badge");
  if (badgeType === "daily") {
    badge.textContent = "📅 今日のことわざ"; badge.className = "badge daily";
  } else if (badgeType === "random") {
    badge.textContent = "🎲 ランダム"; badge.className = "badge random";
  } else {
    badge.textContent = "🃏 カード"; badge.className = "badge browse";
  }
}

function swapTo(newPos, type) {
  badgeType = type;
  card.classList.remove("flipped");
  card.classList.add("fade");
  setTimeout(() => {
    pos = newPos;
    render();
    card.classList.remove("fade");
  }, 150);
}

function showDaily() {
  mode = "all";
  query = "";
  document.getElementById("searchInput").value = "";
  document.getElementById("searchCount").textContent = "";
  updateChips();
  rebuildPool();
  swapTo(getDailyIndex(), "daily");
}

function showRandom() {
  if (!pool.length) return;
  let n;
  do { n = Math.floor(Math.random() * pool.length); }
  while (n === pos && pool.length > 1);
  swapTo(n, "random");
}

function nextCard() { if (pool.length) swapTo((pos + 1) % pool.length, "browse"); }
function prevCard() { if (pool.length) swapTo((pos - 1 + pool.length) % pool.length, "browse"); }

function setMode(m) {
  mode = m;
  updateChips();
  rebuildPool();
  pos = 0;
  badgeType = "browse";
  card.classList.remove("flipped");
  render();
  updateSearchCount();
}

function updateChips() {
  document.getElementById("chipAll").classList.toggle("active", mode === "all");
  document.getElementById("chipFav").classList.toggle("active", mode === "fav");
}

function toggleFav(e) {
  e.stopPropagation();
  if (!pool.length) return;
  const key = PROVERBS[pool[pos]].text;
  if (favs.has(key)) favs.delete(key); else favs.add(key);
  localStorage.setItem("kotowazaFavs", JSON.stringify([...favs]));
  if (mode === "fav") {
    rebuildPool();
    if (pos >= pool.length) pos = Math.max(0, pool.length - 1);
    card.classList.remove("flipped");
  }
  render();
}

function copyProverb() {
  if (!pool.length) return;
  const p = PROVERBS[pool[pos]];
  const text = `【${p.country}のことわざ】\n${p.text}\n\n${p.meaning}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.classList.add("copied");
    btn.textContent = "✓";
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = "📋"; }, 1500);
  });
}

function onSearch(q) {
  query = q.trim();
  rebuildPool();
  pos = 0;
  badgeType = query ? "browse" : badgeType;
  card.classList.remove("flipped");
  render();
  updateSearchCount();
}

function updateSearchCount() {
  document.getElementById("searchCount").textContent = query ? `${pool.length}件` : "";
}

// ==========================================
// タップでフリップ / スワイプでカード送り
// ==========================================
let startX = null, dragDX = 0, suppressClick = false;

card.addEventListener("click", () => {
  if (suppressClick) { suppressClick = false; return; }
  if (pool.length) card.classList.toggle("flipped");
});

stage.addEventListener("touchstart", (e) => {
  startX = e.touches[0].clientX;
  dragDX = 0;
  card.classList.add("dragging");
}, { passive: true });

stage.addEventListener("touchmove", (e) => {
  if (startX === null) return;
  dragDX = e.touches[0].clientX - startX;
  const flip = card.classList.contains("flipped") ? " rotateY(180deg)" : "";
  card.style.transform = `translateX(${dragDX}px) rotate(${dragDX / 60}deg)${flip}`;
}, { passive: true });

stage.addEventListener("touchend", () => {
  card.classList.remove("dragging");
  card.style.transform = "";
  if (Math.abs(dragDX) > 60) {
    suppressClick = true;
    if (dragDX < 0) nextCard(); else prevCard();
  } else if (Math.abs(dragDX) > 10) {
    suppressClick = true;
  }
  startX = null;
  dragDX = 0;
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") nextCard();
  else if (e.key === "ArrowLeft") prevCard();
  else if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    if (pool.length) card.classList.toggle("flipped");
  }
});

// ==========================================
// 初期化
// ==========================================
document.getElementById("dateLabel").textContent = formatDate(new Date());
document.getElementById("totalCount").textContent = PROVERBS.length;
rebuildPool();
pos = getDailyIndex();
render();
</script>
