<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界のことわざ</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #0d0e1a;
    color: #e8eaf6;
    font-family: "Yu Gothic UI", "Meiryo UI", "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  /* 背景グラデーション */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(80,40,160,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(20,80,160,0.20) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
  }

  /* ─── ヘッダー ─── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: background 0.4s, color 0.4s;
  }
  .badge.daily  { background: #ffd166; color: #1a1030; }
  .badge.random { background: #06d6a0; color: #0a2018; }

  .date-label {
    font-size: 12px;
    color: #7075a0;
  }

  /* ─── カード ─── */
  .card {
    background: rgba(30, 32, 56, 0.85);
    border: 1px solid rgba(80,85,140,0.4);
    border-radius: 20px;
    padding: 40px 48px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: opacity 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .card.fade { opacity: 0; }

  /* カードの光沢ライン */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
  }

  .country {
    font-size: 12px;
    color: #7075a0;
    letter-spacing: 0.08em;
    margin-bottom: 20px;
  }

  .proverb-text {
    font-size: clamp(18px, 4vw, 26px);
    font-weight: 700;
    color: #ffd166;
    line-height: 1.6;
    margin-bottom: 24px;
    letter-spacing: 0.02em;
    white-space: pre-line;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: rgba(112,117,160,0.4);
    margin: 0 auto 20px;
  }

  .meaning {
    font-size: 14px;
    color: #c0c4e8;
    line-height: 1.8;
    max-width: 560px;
  }

  /* ─── ナビゲーション ─── */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
    gap: 12px;
  }

  .btn-group {
    display: flex;
    gap: 10px;
  }

  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 10px;
    padding: 10px 20px;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    letter-spacing: 0.02em;
  }
  button:active { transform: scale(0.97); }

  .btn-daily {
    background: #2e3562;
    color: #e8eaf6;
  }
  .btn-daily:hover { background: #3d4680; box-shadow: 0 4px 16px rgba(80,100,200,0.3); }

  .btn-random {
    background: #1a3d30;
    color: #06d6a0;
    border: 1px solid #06d6a0;
  }
  .btn-random:hover { background: #06d6a0; color: #0a2018; box-shadow: 0 4px 16px rgba(6,214,160,0.3); }

  .btn-copy {
    background: rgba(255,255,255,0.06);
    color: #9090bb;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
  }
  .btn-copy:hover { background: rgba(255,255,255,0.12); color: #e8eaf6; }
  .btn-copy.copied { color: #ffd166; border-color: #ffd166; }

  .counter {
    font-size: 11px;
    color: #505080;
    margin-left: auto;
    margin-right: 4px;
    white-space: nowrap;
  }

  /* ─── 検索・フィルター ─── */
  .search-bar {
    margin-top: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-input {
    flex: 1;
    background: rgba(30,32,56,0.7);
    border: 1px solid rgba(80,85,140,0.4);
    border-radius: 10px;
    color: #e8eaf6;
    font-family: inherit;
    font-size: 13px;
    padding: 9px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input::placeholder { color: #505080; }
  .search-input:focus { border-color: #6066a0; }

  .search-count {
    font-size: 11px;
    color: #505080;
    white-space: nowrap;
  }

  /* ─── フッター ─── */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 11px;
    color: #404060;
  }

  @media (max-width: 520px) {
    .card { padding: 28px 24px; }
    .btn-group { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <span class="badge daily" id="badge">📅 今日のことわざ</span>
    <span class="date-label" id="dateLabel"></span>
  </div>

  <div class="card" id="card">
    <div class="country" id="country"></div>
    <div class="proverb-text" id="proverbText"></div>
    <div class="divider"></div>
    <div class="meaning" id="meaning"></div>
  </div>

  <div class="nav">
    <div class="btn-group">
      <button class="btn-daily"  onclick="showDaily()">📅 今日のことわざ</button>
      <button class="btn-random" onclick="showRandom()">🎲 ランダム</button>
    </div>
    <span class="counter" id="counter"></span>
    <button class="btn-copy" id="copyBtn" onclick="copyProverb()" title="コピー">📋</button>
  </div>

  <div class="search-bar">
    <input class="search-input" type="text" id="searchInput"
           placeholder="ことわざ・国名・意味で検索…" oninput="onSearch(this.value)">
    <span class="search-count" id="searchCount"></span>
  </div>

</div>

<div class="footer">世界のことわざ集 — <span id="totalCount"></span>件 収録</div>

// ==========================================
// ロジック
// ==========================================
let currentIndex = -1;
let searchResults = null; // null = 全件, array = 検索結果

function getDailyIndex() {
  const d = new Date();
  const s = d.getFullYear() + "-" +
            String(d.getMonth()+1).padStart(2,"0") + "-" +
            String(d.getDate()).padStart(2,"0");
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
  return h % PROVERBS.length;
}

function formatDate(d) {
  return `${d.getFullYear()}年 ${d.getMonth()+1}月 ${d.getDate()}日（` +
         ["日","月","火","水","木","金","土"][d.getDay()] + "）";
}

function display(index, isDaily) {
  const card = document.getElementById("card");
  card.classList.add("fade");
  setTimeout(() => {
    currentIndex = index;
    const p = PROVERBS[index];
    document.getElementById("country").textContent = `[ ${p.country} ]`;
    document.getElementById("proverbText").textContent = p.text;
    document.getElementById("meaning").textContent = p.meaning;
    const total = searchResults ? searchResults.length : PROVERBS.length;
    const pos   = searchResults ? searchResults.indexOf(index) + 1 : index + 1;
    document.getElementById("counter").textContent = `${pos} / ${total}`;
    const badge = document.getElementById("badge");
    if (isDaily) {
      badge.textContent = "📅 今日のことわざ";
      badge.className = "badge daily";
    } else {
      badge.textContent = "🎲 ランダム";
      badge.className = "badge random";
    }
    card.classList.remove("fade");
  }, 150);
}

function showDaily() {
  searchResults = null;
  document.getElementById("searchInput").value = "";
  document.getElementById("searchCount").textContent = "";
  display(getDailyIndex(), true);
}

function showRandom() {
  const pool = searchResults ?? PROVERBS.map((_,i) => i);
  if (pool.length === 0) return;
  let idx;
  do { idx = pool[Math.floor(Math.random() * pool.length)]; }
  while (idx === currentIndex && pool.length > 1);
  display(idx, false);
}

function copyProverb() {
  const p = PROVERBS[currentIndex];
  const text = `【${p.country}のことわざ】\n${p.text}\n\n${p.meaning}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.classList.add("copied");
    btn.textContent = "✓";
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = "📋"; }, 1500);
  });
}

function onSearch(q) {
  q = q.trim();
  if (!q) {
    searchResults = null;
    document.getElementById("searchCount").textContent = "";
    showDaily();
    return;
  }
  const lower = q.toLowerCase();
  const hits = PROVERBS
    .map((p, i) => ({p, i}))
    .filter(({p}) =>
      p.text.toLowerCase().includes(lower) ||
      p.meaning.includes(q) ||
      p.country.includes(q)
    )
    .map(({i}) => i);

  searchResults = hits;
  document.getElementById("searchCount").textContent =
    hits.length > 0 ? `${hits.length}件` : "0件";
  if (hits.length > 0) display(hits[0], false);
}

// ==========================================
// 初期化
// ==========================================
document.getElementById("dateLabel").textContent = formatDate(new Date());
document.getElementById("totalCount").textContent = PROVERBS.length;
showDaily();
</script>
